name: 🔄  Loc Auto Sign

on:
  # 手动触发：勾 account_login 可强制走账号登录（测打码链路，不读 cookie 文件）
  workflow_dispatch:
    inputs:
      account_login:
        description: "强制用账号登录（跳过 cookie 文件）"
        type: boolean
        default: false
  # 定时触发（UTC）
  schedule:
    - cron: "02 00 * * *"

# 写权限：脚本要把 cookies/*.enc 推回私有库，步骤 9 要推 loc/time.txt 回本库
permissions:
  contents: write

concurrency:
  group: loc-sign
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_DIR: loc
      SCRIPT_NAME: loc-sign.py
      SCRIPT_DESC: loc 签到脚本
      PRIVATE_DIR: ${{ github.repository_owner }}-${{ github.event.repository.name }}-loc

    steps:
      # 1. 两个仓库：本库（放 loc/time.txt）+ 私有库（放脚本和 cookies/*.enc）
      - name: 📥 检出本仓库
        uses: actions/checkout@v4

      - name: 🔐 检出私有库
        uses: actions/checkout@v4
        with:
          repository: doraemon6789/auto_loc_sign
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.PRIVATE_DIR }}
          fetch-depth: 1

      # 2. 运行环境
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk xdotool python3-tk
          mkdir -p ${{ env.PRIVATE_DIR }}/screenshots

      - name: 📚 安装 Python 依赖
        run: |
          pip install --upgrade pip
          # seleniumbase 钉 4.57.1：4.58.0 去掉了 UC 模式的 --disable-popup-blocking，
          # uc_open_with_reconnect() 第二次调用时 window.open 被拦会直接崩。
          # pyautogui + xdotool 只给「打码服务不可用时的真鼠标点击兜底」用。
          pip install requests "seleniumbase==4.57.1" pyvirtualdisplay pyautogui PySocks PyNaCl
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "ℹ️ 无 requirements.txt，跳过"
          fi

      # 3. 可选代理（只在国内出口需要时才配 HY2_PROXY_URL）
      - name: 📡 安装 Hysteria2
        run: |
          if [ -n "${{ secrets.HY2_PROXY_URL }}" ]; then
            curl -L -o hysteria \
              https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
            chmod +x hysteria
            sudo mv hysteria /usr/local/bin/hysteria
            hysteria version
            echo "✅ Hysteria2 安装完成"
          else
            echo "⚠️ 未配置代理，跳过 Hysteria2 安装"
          fi

      - name: ⏳ 添加随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      # 4. 跑脚本：cookie 全部来自私有库的 cookies/*.enc，没有任何 cookie secret
      - name: 🚀 执行 ${{ env.SCRIPT_DESC }}
        working-directory: ${{ env.PRIVATE_DIR }}
        env:
          # 账号列表：每行 `标识,密码`（标识 = 用户名或邮箱）
          LOC_BATCH: ${{ secrets.LOC_BATCH }}

          # 人机验证打码：NoneCap（key 和本仓库其它脚本共用，配这一个就够）
          NONECAP_API_KEY: ${{ secrets.NONECAP_API_KEY }}
          NONECAP_BASE_URL: https://api.nonecap.com/v1

          # 手动触发勾选后强制走账号登录
          LOC_FORCE_ACCOUNT: ${{ inputs.account_login }}

          HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          SOCKS_PORT: ${{ secrets.SOCKS_PORT || '51080' }}
          SCREENSHOT_DIR: screenshots
        run: xvfb-run -a python ${{ env.SCRIPT_NAME }}

      # 5. 收尾：留证据、清工作区、记时间
      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_DIR }}-screenshots-${{ github.run_id }}
          path: ${{ env.PRIVATE_DIR }}/screenshots/
          if-no-files-found: ignore     # 走 cookie 路径时没有截图，正常
          retention-days: 7

      - name: 🗑️ 清理本地截图
        if: always()
        run: |
          rm -rf "${{ env.PRIVATE_DIR }}/screenshots/"* 2>/dev/null || true
          echo "✅ 本地截图已清理"

      - name: ⏱️ 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p loc && echo "$(date +'%Y-%m-%d %H:%M:%S')" > loc/time.txt
          git add loc/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新 loc 执行时间: $(date +'%Y-%m-%d %H:%M:%S')"
            for _try in 1 2 3; do
              git fetch origin main
              if git push origin HEAD:main; then
                echo "✅ 更改已推送"
                exit 0
              fi
              echo "第 $_try 次推送被拒/失败，重试"
              git reset --soft FETCH_HEAD
              sleep 3
            done
            echo "::warning::time.txt 3 次推送均失败，本次未更新（不影响本次执行结果）"
          fi
