# =============================================================================
# woiden.id 自动续期 —— ② 号（@kimisiwa）
# -----------------------------------------------------------------------------
# 每组一个 workflow，Secret 里只放该组账号：
#   - WOIDEN_BATCH_2：此组账号的 JSON（格式见仓库 README / 脚本注释）
#   - WOIDEN_GH_PAT：跨仓库取脚本 + 提交日志所需的 PAT（Contents: Read and write）
#   - ② 号专用：WOIDEN_WARP / WOIDEN_PRIV_KEY / WOIDEN_PRIV_PUB（若脚本支持则注入）
#   - ③ 号专用：WOIDEN_VPN_OVPN / WOIDEN_VPN_AUTH（若脚本支持则注入）
# 脚本统一放在私有仓 doraemon6789/auto_woiden_private:scripts/woiden-renew.py。
# 注意：脚本里默认不再清 chrome 里的网站数据、也不清本地持久化数据；
#       每次以“干净浏览器”起 Chrome，并以无痕模式运行。
#       固定跑 1 个账号（单次固定 1 个账号，没有账号切换），跑完就把截图和日
#       志交回本仓；commit 的 message 里只写"续期结果：成功/失败"。
# 2026-11-19 之前这里有过"跑完后把私有仓的旧截图/旧日志清掉再提交"的逻辑，
# 2026-11-19 之后改成“只往本仓交本次截图和日志，不再去动私有仓”。
# -----------------------------------------------------------------------------
# 触发方式（北京时间 07:30、12:30、16:30 左右各跑一次）：
#   - 07:30 → UTC 23:30（前一日）   → cron: '30 23 * * *'
#   - 12:30 → UTC 04:30（当日）     → cron: '30 4 * * *'
#   - 16:30 → UTC 08:30（当日）     → cron: '0 8 * * *'
#   - 手动跑一次（强制本次必跑，跳过"当日已成功则跳过"）
#     → Actions → 本 workflow → Run workflow → force: true
# -----------------------------------------------------------------------------
# ⚠️ 重要：本文件由 doraemon6789 仓库直接提供，不要手改。
# 2026-11-19 之后上游脚本改动，涉及：
# - WARP
# - commit d06940e1 之前"每次都从头重建整个 chrome 配置目录"（会丢失本地持久化
#   数据，如已登录的网站会话）改为只清理 chrome 配置目录中“易过期”的文件，
#   并且每次都用"干净浏览器"起 Chrome 并以无痕模式运行（无痕窗口不写持久化）。
# - 私有仓 doraemon6789/auto_woiden_private 里的脚本里默认会清掉登录成功的
#   账号在续期完成以后留在"已续期的账号列表"里的账号，见脚本注释。
# - 2026-11-19 之前这里有过"跑完后把私有仓的旧截图/旧日志清掉再提交"的逻辑，
#   2026-11-19 之后改成"只往本仓交本次截图和日志，不再去动私有仓"。
# =============================================================================

name: ♻️ Woiden Auto Renew ②-kimi

on:
  schedule:
    # 北京时间 07:30 → UTC 23:30（前一日）
    - cron: '30 23 * * *'
    # 北京时间 12:30 → UTC 04:30（当日）
    - cron: '30 4 * * *'
    # 北京时间 16:30 → UTC 08:30（当日）
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（跳过"当日已成功则跳过"）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: woiden-renew-2
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PRIVATE_REPO: doraemon6789/auto_woiden_private
  SCRIPT_NAME: woiden-renew.py
  SCRIPT_DIR: scripts
  WOIDEN_BATCH: ${{ secrets.WOIDEN_BATCH_2 }}
  WOIDEN_WARP: ${{ secrets.WOIDEN_WARP }}
  WOIDEN_PRIV_KEY: ${{ secrets.WOIDEN_PRIV_KEY }}
  WOIDEN_PRIV_PUB: ${{ secrets.WOIDEN_PRIV_PUB }}
  WOIDEN_VPN_OVPN: ${{ secrets.WOIDEN_VPN_OVPN }}
  WOIDEN_VPN_AUTH: ${{ secrets.WOIDEN_VPN_AUTH }}
  WOIDEN_GH_PAT: ${{ secrets.WOIDEN_GH_PAT }}

jobs:
  renew:
    name: 续期（② 号）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # ⚠️ 必须只跑一个账号；若要一次跑多个账号，请在上游改脚本/工作流，不要在本仓改。
    steps:
      # 1) 检出本仓
      - name: 检出本仓代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2) 准备产物目录
      - name: 准备产物目录
        run: |
          mkdir -p logs screenshots
          ls -la

      # 3) 从私有仓取脚本
      - name: 从私有仓取脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.WOIDEN_GH_PAT }}
          path: private-repo
          fetch-depth: 1

      # 4) 确认脚本存在
      - name: 确认脚本存在
        run: |
          ls -R private-repo | head -n 200
          test -f "private-repo/${{ env.SCRIPT_DIR }}/${{ env.SCRIPT_NAME }}" || {
            echo "::error::私有仓中找不到脚本 private-repo/${{ env.SCRIPT_DIR }}/${{ env.SCRIPT_NAME }}"
            exit 1
          }
          echo "脚本已确认：private-repo/${{ env.SCRIPT_DIR }}/${{ env.SCRIPT_NAME }}"

      # 5) 校验 WOIDEN_BATCH_2 是否合法
      - name: 校验 WOIDEN_BATCH_2
        run: |
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("WOIDEN_BATCH", "")
          if not raw.strip():
              print("::error::WOIDEN_BATCH_2 为空，请在仓库 Settings → Secrets 里配置 WOIDEN_BATCH_2")
              sys.exit(1)
          try:
              data = json.loads(raw)
          except Exception as e:
              print(f"::error::WOIDEN_BATCH_2 不是合法 JSON：{e}")
              sys.exit(1)
          if isinstance(data, dict):
              accounts = [data]
          elif isinstance(data, list):
              accounts = data
          else:
              print("::error::WOIDEN_BATCH_2 必须是 JSON 对象或数组")
              sys.exit(1)
          # 固定只跑一个账号
          if len(accounts) != 1:
              print(f"::error::② 号固定只跑 1 个账号，当前 WOIDEN_BATCH_2 里有 {len(accounts)} 个账号，请只保留 1 个")
              sys.exit(1)
          a = accounts[0]
          # 兼容两种字段名
          if isinstance(a, dict):
              email = a.get("email") or a.get("account") or a.get("username") or ""
              pwd = a.get("password") or a.get("pswd") or ""
              if not email or not pwd:
                  print("::error::账号缺少 email/password，请检查 WOIDEN_BATCH_2")
                  sys.exit(1)
          elif isinstance(a, str):
              print("::error::② 号账号必须是 JSON 对象（含 email/password），不要只写邮箱字符串")
              sys.exit(1)
          else:
              print("::error::② 号账号格式不正确")
              sys.exit(1)
          print(f"账号校验通过：{email[:3]}***（共 1 个账号）")
          PY

      # 6) 安装 Python 与依赖
      - name: 安装 Python 与依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r private-repo/requirements.txt || pip install -q requests playwright

      # 7) 安装 WARP（仅 ② 号；若 Secret 为空则跳过）
      - name: 安装 WARP
        if: env.WOIDEN_WARP != ''
        run: |
          # WARP 只有在 ② 号才可能用到；若没配就跳过
          echo "开始安装 WARP..."
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y
          sudo apt-get install -y cloudflare-warp
          # 若提供私钥则注册
          if [ -n "${{ env.WOIDEN_PRIV_KEY }}" ]; then
            echo "检测到 WOIDEN_PRIV_KEY，尝试注册 WARP..."
            # 注意：私钥文件路径与格式见脚本注释；这里只做最小处理
            mkdir -p ~/.config/warp || true
            echo "${{ env.WOIDEN_PRIV_KEY }}" > /tmp/warp-priv-key
            chmod 600 /tmp/warp-priv-key
          fi
          warp-cli --accept-tos register || true
          warp-cli --accept-tos connect || true
          sleep 5
          curl -s https://ifconfig.me || true
          echo "WARP 安装完成"

      # 8) 安装代理（若有；目前脚本主要用 WARP，此步为兜底）
      - name: 安装代理
        if: env.WOIDEN_VPN_OVPN != ''
        run: |
          echo "检测到 WOIDEN_VPN_OVPN，安装 OpenVPN..."
          sudo apt-get update -y
          sudo apt-get install -y openvpn
          echo "${{ env.WOIDEN_VPN_OVPN }}" | base64 -d > /tmp/client.ovpn
          echo "${{ env.WOIDEN_VPN_AUTH }}" | base64 -d > /tmp/auth.txt
          chmod 600 /tmp/client.ovpn /tmp/auth.txt
          sudo openvpn --config /tmp/client.ovpn --auth-user-pass /tmp/auth.txt --daemon
          sleep 10
          curl -s https://ifconfig.me || true
          echo "VPN 已启动"

      # 9) 随机延迟 0-60 秒（避免多账号同时跑）
      - name: 随机延迟
        run: |
          DELAY=$((RANDOM % 61))
          echo "随机延迟 ${DELAY} 秒..."
          sleep $DELAY

      # 10) 执行续期脚本
      - name: 执行续期脚本
        id: renew
        run: |
          set -o pipefail
          echo "开始执行续期脚本..."
          python "private-repo/${{ env.SCRIPT_DIR }}/${{ env.SCRIPT_NAME }}" 2>&1 | tee logs/renew.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "脚本退出码：${EXIT_CODE}"
          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "RENEW_RESULT=失败" >> "$GITHUB_ENV"
            echo "::warning::续期脚本执行失败，退出码 ${EXIT_CODE}"
          else
            echo "RENEW_RESULT=成功" >> "$GITHUB_ENV"
          fi
          # 即使脚本失败也继续提交日志/截图
          exit 0

      # 11) 上传截图（供调试）
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # 12) 上传日志
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      # 13) 提交本次截图和日志到本仓
      - name: 提交本次截图和日志
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git add logs screenshots || true
          if git diff --cached --quiet; then
            echo "没有新的截图/日志需要提交"
            exit 0
          fi
          git commit -m "续期结果：${RENEW_RESULT:-未知}（${TIMESTAMP}）"
          git push

      # 14) 清理旧的 workflow 运行记录
      - name: 清理旧运行记录
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'woiden-renew-2.yml',
              per_page: 100,
            });
            const keep = 10;
            const old = runs.data.workflow_runs.slice(keep);
            for (const run of old) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`已删除旧运行 ${run.id}`);
              } catch (e) {
                console.log(`删除运行 ${run.id} 失败：${e.message}`);
              }
            }
