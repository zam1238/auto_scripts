# =============================================================================
# woiden.id 自动续期 —— ②号 (@kimisiwa)
# 本文件 = woiden 第 ② 个组（Github handle @kimisiwa 那一套）
# secret WOIDEN_BATCH_2
# 时间文件 woiden/2/time.txt (state.enc 也在 woiden/2/)
# group woiden_renew_2
# cron 北京时间 07:30 / 12:30 / 16:00 (与 ① 号错开 20-30 分钟)
# 第 ① 个账号 (@mimosiwa) 在 woiden-renew.yml，两文件互不影响、别合开。
# ★ woiden.id 和 hax.co.id 是两个独立站点，账号、secret 都不通用。
# hax 在 hus-renew.yml，本文件只跑 woiden.id。
#
# 需要配置的 Secrets (在 public 仓 Settings -> Secrets and variables -> Actions 里建)：
# WOIDEN_BATCH_2 phone, tg_bot_token, tg_chat_id, tg_api_hash, tg_session
# (本文件第 2 对应 @kimisiwa; ① 号 woiden-renew.yml 读 WOIDEN_BATCH)
# (若本站只分发验证码 in 分组，也支持 JSON 数组，见 woiden-renew.py)
# WOIDEN_TG_BOT 可选，站内 TG 验证时用户名，站内、站外 TG_bot
# (woiden.id 与 hax.co.id 共用同一个 bot)
# HY2_PROXY_URL 代理 URL, woiden.id 有 Cloudflare 挑战，强烈建议配置
# PRIVATE_REPO_TOKEN 有 auto_woiden_private 该仓库的 PAT
# SOCKS_PORT 可选，默认 10808
# WOIDEN_GH_PAT 可选，若用 https 方式拉取私有仓则用 WOIDEN_GH_PAT 替代
# PRIVATE_REPO_TOKEN，默认值 doraemon6789/auto_woiden_private
# =============================================================================

name: ♻️ Woiden Auto Renew ②-kimi

on:
  schedule:
    # 北京时间 07:30 → UTC 23:30（前一日）
    - cron: '30 23 * * *'
    # 北京时间 12:30 → UTC 04:30（当日）
    - cron: '30 4 * * *'
    # 北京时间 16:00 → UTC 08:00（当日）
    - cron: '0 8 * * *'
    # 注意：① 号 (woiden-renew.yml) 的时间是
    # 北京时间 07:10 (UTC 23:10) / 12:10 (UTC 04:10) / 16:10 (UTC 08:10)
    # ② 号 hus② 的时间是
    # 北京时间 07:20 (UTC 23:20) / 12:20 (UTC 04:20) / 16:20 (UTC 08:20)
  workflow_dispatch:
    inputs:
      force:
        description: '忽略当日异常，强制再跑一班（验证/调试用）'
        required: false
        default: false
        type: boolean
      debug:
        description: '调试模式（只打印关键信息，不真正提交）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  renew:
    name: 续期（②号）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: woiden_renew_2
      cancel-in-progress: false
    env:
      WOIDEN_BATCH: ${{ secrets.WOIDEN_BATCH_2 }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: doraemon6789/auto_woiden_private
      PROJECT_DIR: woiden
      SCRIPT_NAME: woiden-renew.py
      SCREENSHOT_DIR: woiden/2/screenshots
      FORCE_RUN: ${{ github.event.inputs.force }}
      TIME_DIR: woiden/2
      DEBUG_FLAG: ${{ github.event.inputs.debug }}
      MAX_RENEW_RETRIES: "3"
      MAX_WARP_RETRIES: "5"
      MAX_WARP_ROTATE_ATTEMPTS: "5"
      MAX_WARP_ROTATE_SECONDS: "240"
      WARP_SAME_IP_GIVEUP: "10"
      MAX_CHANNEL_SWITCHES: "1"
      MAX_LOGIN_RETRIES: "3"
      PROXY_RETRY_COUNT: "5"
      WARP_CMD_TIMEOUT: "60"

    steps:
      # 1) 检出公开仓库
      - name: 检出公开仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2) 创建输出目录
      - name: 创建输出目录
        run: |
          mkdir -p "$TIME_DIR" "$SCREENSHOT_DIR" logs
          ls -la

      # 3) 检出私有仓库
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          path: private-repo
          fetch-depth: 1

      # 4) 确认脚本已就位
      - name: 确认脚本已就位
        run: |
          ls -R private-repo | head -n 200
          test -f "private-repo/${PROJECT_DIR}/${SCRIPT_NAME}" || {
            echo "::error::私有仓中找不到脚本 private-repo/${PROJECT_DIR}/${SCRIPT_NAME}"
            exit 1
          }
          echo "脚本已确认：private-repo/${PROJECT_DIR}/${SCRIPT_NAME}"

      # 5) 校验 WOIDEN_BATCH_2 是否合法
      - name: 校验 WOIDEN_BATCH_2
        run: |
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("WOIDEN_BATCH", "")
          if not raw.strip():
              print("::error::WOIDEN_BATCH_2 为空，请在仓库 Settings → Secrets 里配置 WOIDEN_BATCH_2")
              sys.exit(1)
          try:
              data = json.loads(raw)
          except Exception as e:
              print(f"::error::WOIDEN_BATCH_2 不是合法 JSON：{e}")
              sys.exit(1)
          if isinstance(data, dict):
              accounts = [data]
          elif isinstance(data, list):
              accounts = data
          else:
              print("::error::WOIDEN_BATCH_2 必须是 JSON 对象或数组")
              sys.exit(1)
          # 固定只跑一个账号
          if len(accounts) != 1:
              print(f"::error::② 号固定只跑 1 个账号，当前 WOIDEN_BATCH_2 里有 {len(accounts)} 个账号，请只保留 1 个")
              sys.exit(1)
          a = accounts[0]
          # 兼容两种字段名
          if isinstance(a, dict):
              email = a.get("email") or a.get("account") or a.get("username") or ""
              pwd = a.get("password") or a.get("pswd") or ""
              if not email or not pwd:
                  print("::error::账号缺少 email/password，请检查 WOIDEN_BATCH_2")
                  sys.exit(1)
          elif isinstance(a, str):
              print("::error::② 号账号必须是 JSON 对象（含 email/password），不要只写邮箱字符串")
              sys.exit(1)
          else:
              print("::error::② 号账号格式不正确")
              sys.exit(1)
          print(f"账号校验通过：{email[:3]}***（共 1 个账号）")
          PY

      # 6) 安装 Python 与依赖
      - name: 安装 Python 与依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -q -r private-repo/requirements.txt || pip install -q requests playwright

      # 7) 安装 WARP
      - name: 安装 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual

      # 8) 安装代理
      - name: 安装代理
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "未配置 HY2_PROXY_URL，跳过代理安装"
            exit 0
          fi
          echo "正在安装代理..."
          echo "$PROXY_CONTENT" > /tmp/proxy.txt
          echo "代理配置已写入"

      # 9) 随机延迟
      - name: 随机延迟
        run: |
          DELAY=$((RANDOM % 61))
          echo "随机延迟 ${DELAY} 秒..."
          sleep $DELAY

      # 10) 执行续期脚本
      - name: 执行续期脚本
        id: renew
        run: |
          set -o pipefail
          echo "开始执行续期脚本..."
          python "private-repo/${PROJECT_DIR}/${SCRIPT_NAME}" 2>&1 | tee logs/renew.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "脚本退出码：${EXIT_CODE}"
          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "RENEW_RESULT=失败" >> "$GITHUB_ENV"
            echo "::warning::续期脚本执行失败，退出码 ${EXIT_CODE}"
          else
            echo "RENEW_RESULT=成功" >> "$GITHUB_ENV"
          fi
          exit 0

      # 11) 上传截图
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: ${{ env.SCREENSHOT_DIR }}/
          if-no-files-found: ignore
          retention-days: 7

      # 12) 上传日志
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      # 13) 清理截图
      - name: 清理截图
        if: always()
        run: |
          echo "清理 7 天前的截图..."
          find "$SCREENSHOT_DIR" -type f -mtime +7 -delete || true
          find "$SCREENSHOT_DIR" -type d -empty -delete || true
          ls -R "$SCREENSHOT_DIR" || true

      # 14) 提交时间
      - name: 提交时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          echo "$TIMESTAMP" > "$TIME_DIR/time.txt"
          git add "$TIME_DIR" "$SCREENSHOT_DIR" logs || true
          if git diff --cached --quiet; then
            echo "没有新的时间/截图/日志需要提交"
            exit 0
          fi
          git commit -m "续期结果：${RENEW_RESULT:-未知}（${TIMESTAMP}）"
          git push

      # 15) 清理旧运行记录
      - name: 清理旧运行记录
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'woiden-renew-2.yml',
              per_page: 100,
            });
            const keep = 10;
            const old = runs.data.workflow_runs.slice(keep);
            for (const run of old) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`已删除旧运行 ${run.id}`);
              } catch (e) {
                console.log(`删除运行 ${run.id} 失败：${e.message}`);
              }
            }
